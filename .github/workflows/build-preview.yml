name: Build Preview (TestFlight & APK)

on:
  workflow_dispatch:
    inputs:
      build-ios:
        description: "Build iOS (TestFlight)"
        required: true
        type: boolean
        default: true
      build-android:
        description: "Build Android (APK)"
        required: true
        type: boolean
        default: true
      submit-testflight:
        description: "Submit iOS build to TestFlight"
        required: false
        type: boolean
        default: false
      cleanup-disk:
        description: "Free disk space on runner before build"
        required: false
        type: boolean
        default: false

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  build-ios:
    if: ${{ inputs.build-ios }}
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: 🏗 Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: 🏗 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: ♻️ Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: ♻️ Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-${{ hashFiles('ios/**/*.xcworkspace', 'ios/**/*.xcodeproj') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔧 Prepare artifact metadata
        id: artifact_meta
        run: |
          CONFIG=$(npx expo config --json --type public)
          APP_NAME=$(node -e "const c = JSON.parse(process.argv[1]); console.log(c.name.replace(/\\s+/g,''));" "$CONFIG")
          DATE=$(date +'%Y%m%d')
          echo "APP_NAME=$APP_NAME" >> $GITHUB_OUTPUT
          echo "DATE=$DATE" >> $GITHUB_OUTPUT

      - name: 🍎 Build iOS app
        run: eas build --platform ios --profile preview --local --non-interactive --output ${{ github.workspace }}/app-preview.ipa

      - name: 📄 Capture iOS version info
        id: ios_meta
        run: |
          export EAS_TOKEN=${EXPO_TOKEN:-}
          APP_VERSION=$(npx expo config --json --type public | jq -r '.version')
          BUILD_NUMBER=$(eas build:version:get --platform ios --profile preview --json --non-interactive | jq -r '.buildNumber')
          BASENAME="${{ steps.artifact_meta.outputs.APP_NAME }}-preview-v${APP_VERSION}(${BUILD_NUMBER})-${{ steps.artifact_meta.outputs.DATE }}"
          echo "ARTIFACT_BASENAME=$BASENAME" >> $GITHUB_OUTPUT
          echo "IOS_OUTPUT=${BASENAME}.ipa" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: 🔄 Rename iOS artifact
        run: mv "${{ github.workspace }}/app-preview.ipa" "${{ github.workspace }}/${{ steps.ios_meta.outputs.IOS_OUTPUT }}"

      - name: 📊 Create iOS build info
        run: |
          echo "iOS Build Information (Preview/TestFlight)" > ios-build-info.txt
          echo "===========================================" >> ios-build-info.txt
          echo "Build Time: $(date)" >> ios-build-info.txt
          echo "Commit: $(git rev-parse --short HEAD)" >> ios-build-info.txt
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)" >> ios-build-info.txt
          echo "Profile: preview" >> ios-build-info.txt
          echo "Platform: iOS" >> ios-build-info.txt
          echo "Version: ${{ steps.ios_meta.outputs.APP_VERSION }}" >> ios-build-info.txt
          echo "Build Number: ${{ steps.ios_meta.outputs.BUILD_NUMBER }}" >> ios-build-info.txt

      - name: 📤 Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ios_meta.outputs.ARTIFACT_BASENAME }}-ipa
          path: |
            ${{ github.workspace }}/${{ steps.ios_meta.outputs.IOS_OUTPUT }}
            ios-build-info.txt
          retention-days: 30

      - name: 🚀 Submit to TestFlight
        if: ${{ inputs.submit-testflight }}
        run: eas submit --platform ios --path "${{ github.workspace }}/${{ steps.ios_meta.outputs.IOS_OUTPUT }}" --non-interactive
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}

  build-android:
    if: ${{ inputs.build-android }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: ♻️ Free disk space
        if: ${{ inputs.cleanup-disk }}
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: false
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: false
          remove_folders: "/tmp/runner/eas-build-local-nodejs"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - name: 🏗 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: 🏗 Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "pnpm"

      - name: 🏗 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔨 Run prebuild
        run: npx expo prebuild --clean

      - name: 🏗 Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "adopt"
          cache: "gradle"

      - name: 🔧 Prepare artifact metadata
        id: artifact_meta
        run: |
          CONFIG=$(npx expo config --json --type public)
          APP_NAME=$(node -e "const c = JSON.parse(process.argv[1]); console.log(c.name.replace(/\\s+/g,''));" "$CONFIG")
          DATE=$(date +'%Y%m%d')
          echo "APP_NAME=$APP_NAME" >> $GITHUB_OUTPUT
          echo "DATE=$DATE" >> $GITHUB_OUTPUT

      - name: 🤖 Build Android APK
        run: eas build --platform android --profile preview --local --non-interactive --output ${{ github.workspace }}/app-preview.apk

      - name: 📄 Capture Android version info
        id: android_meta
        run: |
          export EAS_TOKEN=${EXPO_TOKEN:-}
          VERSION_NAME=$(npx expo config --json --type public | jq -r '.version')
          VERSION_CODE=$(eas build:version:get --platform android --profile preview --json --non-interactive | jq -r '.versionCode')
          BASENAME="${{ steps.artifact_meta.outputs.APP_NAME }}-preview-v${VERSION_NAME}(${VERSION_CODE})-${{ steps.artifact_meta.outputs.DATE }}"
          echo "ARTIFACT_BASENAME=$BASENAME" >> $GITHUB_OUTPUT
          echo "ANDROID_OUTPUT=${BASENAME}.apk" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: 🔄 Rename Android artifact
        run: mv "${{ github.workspace }}/app-preview.apk" "${{ github.workspace }}/${{ steps.android_meta.outputs.ANDROID_OUTPUT }}"

      - name: 📊 Create Android build info
        run: |
          echo "Android Build Information (Preview/Sideload)" > android-build-info.txt
          echo "=============================================" >> android-build-info.txt
          echo "Build Time: $(date)" >> android-build-info.txt
          echo "Commit: $(git rev-parse --short HEAD)" >> android-build-info.txt
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)" >> android-build-info.txt
          echo "Profile: preview" >> android-build-info.txt
          echo "Platform: Android" >> android-build-info.txt
          echo "Build Type: APK (Sideload)" >> android-build-info.txt
          echo "Version: ${{ steps.android_meta.outputs.APP_VERSION }}" >> android-build-info.txt
          echo "Version Code: ${{ steps.android_meta.outputs.VERSION_CODE }}" >> android-build-info.txt

      - name: 📤 Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.android_meta.outputs.ARTIFACT_BASENAME }}-apk
          path: |
            ${{ github.workspace }}/${{ steps.android_meta.outputs.ANDROID_OUTPUT }}
            android-build-info.txt
          retention-days: 30
